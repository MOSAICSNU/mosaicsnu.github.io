[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic"
version = "0.2.0"
description = "MOSAIC: GUI application for Nikon ND2 calcium imaging analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nd2==0.11.3",
  "numpy>=1.26",
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
  "scipy>=1.11",
]

[project.scripts]
mosaic = "mosaic.main:main"

[tool.setuptools.packages.find]
where = ["src"]
